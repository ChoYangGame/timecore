<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1B2436;
    }

    #unity-container {
      position: absolute;
      inset: 0;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #1B2436;
    }

    /* 로딩 화면 */
    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1B2436;
      color: #F2EFE9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      transition: opacity .4s ease;
    }

    #unity-loading-title {
      font-size: 15px;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 22px;
      color: #6FD8E0;
    }

    #unity-progress-track {
      width: 220px;
      height: 2px;
      background: rgba(242, 239, 233, .18);
      overflow: hidden;
    }

    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #6FD8E0;
      transition: width .2s ease;
    }

    #unity-loading-pct {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(242, 239, 233, .55);
      font-variant-numeric: tabular-nums;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: #A8322D;
      color: #fff;
      font-family: sans-serif;
      font-size: 13px;
      border-radius: 4px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading">
      <div id="unity-loading-title">{{{ PRODUCT_NAME }}}</div>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
      <div id="unity-loading-pct">0%</div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas    = document.querySelector("#unity-canvas");
    var loading   = document.querySelector("#unity-loading");
    var fill      = document.querySelector("#unity-progress-fill");
    var pct       = document.querySelector("#unity-loading-pct");
    var warningEl = document.querySelector("#unity-warning");

    function showWarning(msg) {
      warningEl.style.display = "block";
      warningEl.innerHTML = msg;
    }

    var config = {
      dataUrl:        "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl:   "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:        "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl:      "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl:     "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName:    {{{ JSON.stringify(COMPANY_NAME) }}},
      productName:    {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner:     function (msg, type) { showWarning(msg); }
    };

    // 캔버스를 창 크기에 맞춰 실제 픽셀까지 동기화
    function resizeCanvas() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width  = Math.floor(window.innerWidth  * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + "%";
        pct.textContent = p + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        loading.style.opacity = "0";
        setTimeout(function () { loading.style.display = "none"; }, 400);
        canvas.focus();
      }).catch(function (message) {
        showWarning(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
